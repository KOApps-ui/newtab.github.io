<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <defs>
    <!-- Ankaragücü Resmi Sarı ve Lacivert Renkleri -->
    <linearGradient id="agGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDE00"/>
      <stop offset="100%" stop-color="#FFC000"/>
    </linearGradient>
    <linearGradient id="agNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#002D62"/>
      <stop offset="100%" stop-color="#001C3D"/>
    </linearGradient>
    <!-- Türk Bayrağı Kırmızısı -->
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E30A17"/>
      <stop offset="100%" stop-color="#C0000C"/>
    </linearGradient>
    <!-- Gölge Efekti -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Kalkan Dış Çerçevesi (Altın Sarısı & Lacivert Kontur) -->
  <g filter="url(#badgeShadow)">
    <!-- Dış Altın Kalkan -->
    <path d="M 150,15 
             C 235,15 285,35 285,130 
             C 285,245 150,365 150,365 
             C 150,365 15,245 15,130 
             C 15,35 65,15 150,15 Z" 
          fill="url(#agGold)" stroke="#001C3D" stroke-width="4"/>

    <!-- İç Lacivert Katman -->
    <path d="M 150,23 
             C 228,23 275,41 275,130 
             C 275,238 150,352 150,352 
             C 150,352 25,238 25,130 
             C 25,41 72,23 150,23 Z" 
          fill="#002D62"/>
  </g>

  <!-- Kalkan İçi Dikey Sarı & Lacivert Çubuklar (Alt Kısım) -->
  <g id="shieldStripes">
    <clipPath id="innerShieldClip">
      <path d="M 150,27 
               C 225,27 270,44 270,130 
               C 270,234 150,346 150,346 
               C 150,346 30,234 30,130 
               C 30,44 75,27 150,27 Z"/>
    </clipPath>

    <g clip-path="url(#innerShieldClip)">
      <!-- Sarı Zemin -->
      <rect x="0" y="0" width="300" height="380" fill="url(#agGold)"/>
      
      <!-- Lacivert Dikey Çubuklar -->
      <rect x="68" y="0" width="34" height="380" fill="url(#agNavy)"/>
      <rect x="133" y="0" width="34" height="380" fill="url(#agNavy)"/>
      <rect x="198" y="0" width="34" height="380" fill="url(#agNavy)"/>

      <!-- Alt Kısım 1910 Kuruluş Şeridi -->
      <path d="M 90,285 L 210,285 L 185,325 L 150,342 L 115,325 Z" fill="#001C3D" stroke="url(#agGold)" stroke-width="3"/>
      <text x="150" y="318" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="20" fill="url(#agGold)" text-anchor="middle" letter-spacing="2">1910</text>

      <!-- Üst Lacivert Başlık Alanı (MKE ANKARAGÜCÜ) -->
      <rect x="25" y="88" width="250" height="64" fill="#001C3D"/>
      <line x1="25" y1="88" x2="275" y2="88" stroke="url(#agGold)" stroke-width="3"/>
      <line x1="25" y1="152" x2="275" y2="152" stroke="url(#agGold)" stroke-width="3"/>

      <!-- MKE ANKARAGÜCÜ Resmi Metin -->
      <text x="150" y="116" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="18" fill="url(#agGold)" text-anchor="middle" letter-spacing="3">MKE</text>
      <text x="150" y="142" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ANKARAGÜCÜ</text>
    </g>
  </g>

  <!-- Üst Kısım: Türk Bayrağı (Hilal ve Yıldız) Yuvarlak Arması -->
  <g id="turkishFlagBadge">
    <!-- Dış Altın Halka -->
    <circle cx="150" cy="54" r="32" fill="url(#agGold)" stroke="#001C3D" stroke-width="2"/>
    <!-- Kırmızı Daire -->
    <circle cx="150" cy="54" r="28" fill="url(#flagRed)"/>

    <!-- Beyaz Hilal (Crescent) -->
    <path d="M 144,38 
             A 17,17 0 1,0 160,65 
             A 13.5,13.5 0 1,1 144,38 Z" 
          fill="#FFFFFF"/>

    <!-- Beyaz 5 Köşeli Yıldız (Star) -->
    <polygon points="163,47 166,54 173,54 167,58 169,65 163,61 157,65 159,58 153,54 160,54" fill="#FFFFFF"/>
  </g>
</svg>
